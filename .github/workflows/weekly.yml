# 週次統合(パーソナルコーチ化_指示書.md フェーズ1+2)
# 毎週日曜 12:00 UTC = 21:00 JST に weekly.js を実行し、
# summaries/ と PERSONAL_CONTEXT.md の変更をコミットする。
# 必要な Secrets: NOTION_TOKEN, NOTION_DB_ID, ANTHROPIC_API_KEY(またはGEMINI/OPENAI)
name: weekly-digest

on:
  schedule:
    - cron: "0 12 * * 0" # 日曜 21:00 JST(GitHubのcronは数十分遅れることがある)
  workflow_dispatch: # Actionsタブから手動実行も可(初回確認用)

# agent.yml の tick と「同じグループ」に入れて直列化する。
# これがないと 5分ごとの tick と weekly が同時に走り、data/ と summaries/ の
# push が競合して非fast-forwardで落ちる。
# agent.js は経過時間ベースなので、tick が数回スキップされても破綻しない。
concurrency:
  group: yokubo-agent
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Run weekly digest
        run: node weekly.js
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WEEKLY_MODEL: ${{ vars.WEEKLY_MODEL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_TO: ${{ secrets.REPORT_TO }}

      - name: Commit results
        run: |
          set -euo pipefail
          git config user.name "yokubo-weekly"
          git config user.email "actions@users.noreply.github.com"

          # summaries/ は初回実行前は存在しないので、無いまま git add すると
          # pathspec エラーでジョブごと落ちる。先に掘っておく。
          mkdir -p summaries
          git add -A summaries PERSONAL_CONTEXT.md

          if git diff --cached --quiet; then
            echo "変化なし。コミットせず終了"
            exit 0
          fi
          git commit -m "weekly: $(date -u +%F) のサマリーとコンテキスト更新 [skip ci]"

          # concurrency で直列化してあるが、手元からの push などと重なる可能性は残るので
          # rebase → push を最大5回リトライする(|| true で握りつぶさない)
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "push 成功 (試行 ${i} 回目)"
              exit 0
            fi
            echo "push が弾かれた。${i} 回目のリトライ..."
            sleep $((i * 5))
          done
          echo "5回試しても push できなかった" >&2
          exit 1
